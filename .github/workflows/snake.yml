name: Generate contribution snake

on:
  schedule:
    # Updates daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: invinciblearyan
          github_token: ${{ secrets.GH_PAT }}
          outputs: |
            output/github-contribution-grid-snake.svg?palette=github
            output/github-contribution-grid-snake-dark.svg?palette=github&color_snake=8965e0

      - name: Commit snake
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "invinciblearyan"
          git config user.email "aryantyagi32567@gmail.com"
          git add output/*.svg
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "Update contribution snake"
          git push "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
